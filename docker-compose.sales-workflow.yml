services:
  # =========================================================================
  # 1. Unified PostgreSQL Central Database
  # =========================================================================
  db:
    image: postgres:15-alpine
    container_name: nextgen_erp_unified_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextgen_erp
    ports:
      - "5432:5432"
    volumes:
      - ./database/init-sales-workflow/01-sales-schema.sql:/docker-entrypoint-initdb.d/01-sales-schema.sql
      - ./database/init-sales-workflow/02-workflow-schema.sql:/docker-entrypoint-initdb.d/02-workflow-schema.sql
      - ./database/init-sales-workflow/03-sales-seed-data.sql:/docker-entrypoint-initdb.d/03-sales-seed-data.sql
      - ./database/init-sales-workflow/04-workflow-seed-data.sql:/docker-entrypoint-initdb.d/04-workflow-seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextgen_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Sales & Commercial Backend
  # =========================================================================
  sales_backend:
    build:
      context: ./sales-module/backend
      dockerfile: Dockerfile
    container_name: nextgen_sales_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nextgen_erp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # 3. Workflow & Automation Backend
  # =========================================================================
  workflow_backend:
    build:
      context: ./workflow-module/backend
      dockerfile: Dockerfile
    container_name: nextgen_workflow_backend
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nextgen_erp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GOOGLE_CLOUD_PROJECT: nextgen-erp-7753216
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # 4. Unified NextGen ERP Frontend (Sales + Workflow Studio)
  # =========================================================================
  frontend:
    build:
      context: ./sales-module/frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://sales_backend:8080/api/:path*
        WORKFLOW_API_URL: http://workflow_backend:8081/api/:path*
    container_name: nextgen_unified_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://sales_backend:8080/api/:path*
      - WORKFLOW_API_URL=http://workflow_backend:8081/api/:path*
    depends_on:
      - sales_backend
      - workflow_backend
