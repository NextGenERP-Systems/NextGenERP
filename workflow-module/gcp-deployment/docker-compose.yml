services:
  workflow-backend:
    image: ${WORKFLOW_BACKEND_IMAGE:?Set WORKFLOW_BACKEND_IMAGE to a versioned Artifact Registry image}
    container_name: nextgen-workflow-backend
    restart: always
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set the private Workflow PostgreSQL URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set the Workflow database username}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the Workflow database password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:${WORKFLOW_BACKEND_PORT:-8082}:8082"

  workflow-frontend:
    image: ${WORKFLOW_FRONTEND_IMAGE:?Set WORKFLOW_FRONTEND_IMAGE to a versioned Artifact Registry image}
    container_name: nextgen-workflow-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://workflow-backend:8082/api/v1
    ports:
      - "127.0.0.1:${WORKFLOW_FRONTEND_PORT:-3002}:3000"
    depends_on:
      - workflow-backend
