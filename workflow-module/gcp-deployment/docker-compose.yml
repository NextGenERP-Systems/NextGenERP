services:
  workflow-db:
    image: postgres:16-alpine
    container_name: nextgen-workflow-postgres
    restart: always
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_password}
    ports:
      - "5432:5432"
    volumes:
      - workflow-pgdata:/var/lib/postgresql/data
      - ../database/init-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d workflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  workflow-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nextgen-workflow-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://workflow-db:5432/workflow_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      workflow-db:
        condition: service_healthy

  workflow-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nextgen-workflow-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://workflow-backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - workflow-backend

  workflow-nginx:
    image: nginx:alpine
    container_name: nextgen-workflow-nginx-proxy
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - workflow-frontend
      - workflow-backend

volumes:
  workflow-pgdata:
