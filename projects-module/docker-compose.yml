version: '3.8'
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_erp_projects_backend
    ports:
      - "8087:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/projects_module_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://backend:8080/api/:path*
    container_name: nextgen_erp_projects_frontend
    ports:
      - "3003:3000"
    environment:
      - BACKEND_API_URL=http://backend:8080/api/:path*
      - NEXT_PUBLIC_API_URL=http://localhost:8087/api/v1
    depends_on:
      - backend
