services:
  stock_backend:
    build:
      context: ./stock-module/backend
      dockerfile: Dockerfile
    container_name: nextgen_stock_backend
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://nextgen_erp_unified_db:5432/nextgen_erp?currentSchema=stock,public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - nextgenerp_default

  stock_frontend:
    build:
      context: ./stock-module/frontend
      dockerfile: Dockerfile
    container_name: nextgen_stock_frontend
    restart: unless-stopped
    ports:
      - "3006:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:8084/api/v1/stock
    networks:
      - nextgenerp_default

networks:
  nextgenerp_default:
    external: true
