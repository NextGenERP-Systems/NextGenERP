services:
  hrm-postgres:
    image: postgres:16-alpine
    container_name: nextgen-hrm-postgres
    restart: always
    environment:
      POSTGRES_DB: nextgen_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - hrm-pgdata:/var/lib/postgresql/data
      - ../database/init-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextgen_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  hrm-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nextgen-hrm-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hrm-postgres:5432/nextgen_erp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      hrm-postgres:
        condition: service_healthy

  hrm-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nextgen-hrm-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      BACKEND_API_URL: http://hrm-backend:8081/api/:path*
    ports:
      - "3001:3001"
    depends_on:
      - hrm-backend

  hrm-nginx:
    image: nginx:alpine
    container_name: nextgen-hrm-nginx-proxy
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hrm-frontend
      - hrm-backend

volumes:
  hrm-pgdata:
