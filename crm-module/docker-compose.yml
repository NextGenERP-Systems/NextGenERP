name: crm-module

services:
  crm-module:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-module
    ports:
      - "127.0.0.1:8088:8085"
    environment:
      PORT: 8085
      SALES_SERVICE_URL: ${SALES_SERVICE_URL:-http://host.docker.internal:8080}
      POSTGRES_USER: ${CRM_DB_USERNAME:-crm}
      POSTGRES_DB: ${CRM_DB_NAME:-nextgen_erp}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD before starting CRM}
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    stop_grace_period: 30s

  crm-frontend:
    profiles: [frontend]
    build:
      context: ./frontend
      args:
        CRM_API_URL: http://crm-module:8085
    ports:
      - "127.0.0.1:${CRM_FRONTEND_PORT:-3008}:3008"
    depends_on:
      - crm-module

volumes:
  crm-postgres-data:
