# Explicit migration-only override. Use only after backup and schema review.
# It never starts the frontend or a PostgreSQL container.
services:
  mrp-backend:
    environment:
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      MRP_MIGRATION_ONLY: "true"
      MRP_WEB_APPLICATION_TYPE: "none"
