services:
  mrp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen-mrp-backend
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5433/nextgen_mrp}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME before starting MRP}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD before starting MRP}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}

  mrp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextgen-mrp-frontend
    ports:
      - "3005:3005"
    environment:
      BACKEND_URL: http://mrp-backend:8085/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8085/api/v1
    depends_on:
      - mrp-backend
